name: Backend tests

# Runs the backend and updater test suites, including the migration tests
# against a real PostgreSQL, and fails if the SQLModel models and the Alembic
# migrations disagree (someone changed a model without adding a migration).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: look
          POSTGRES_PASSWORD: look
          POSTGRES_DB: look_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U look"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Settings for `python -m app.migrate` / `alembic check` below.
      DB_ENGINE: postgres
      POSTGRES_HOST: localhost
      POSTGRES_USER: look
      POSTGRES_PASSWORD: look
      POSTGRES_DB: look_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migration drift check (models vs migrations, on PostgreSQL)
        run: |
          python -m app.migrate
          alembic check

      - name: Backend tests (migration tests also run on PostgreSQL)
        env:
          # Throwaway database: the migration tests wipe it.
          TEST_DATABASE_URL: postgresql+psycopg://look:look@localhost:5432/look_test
        run: pytest -q

      - name: Updater tests
        working-directory: updater
        run: pytest -q
