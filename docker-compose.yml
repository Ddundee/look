# Project name is pinned: named volumes are prefixed with it
# (todo-app_postgres_data), and the updater runs Compose from /project,
# where the folder-derived default would differ and start an empty DB.
name: todo-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_app}
      POSTGRES_DB: ${POSTGRES_DB:-todo_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose — only other containers on this
    # compose network can reach Postgres.

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-ghcr.io/ddundee/look}-backend:latest
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      # Always bind to all interfaces INSIDE the container's own network
      # namespace. Host-level exposure (localhost/LAN/Tailscale) is
      # controlled below by the `ports:` mapping, which is where BIND_HOST
      # from .env actually applies.
      BIND_HOST: 0.0.0.0
      POSTGRES_HOST: db
      UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
    volumes:
      - backend_data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build: ./backend
    image: ${IMAGE_PREFIX:-ghcr.io/ddundee/look}-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "mcp_server.server", "--transport", "http"]
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      POSTGRES_HOST: db
    volumes:
      - backend_data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:${MCP_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the build (Next.js resolves rewrites at build time,
        # not at container start) — must match the `backend` service name
        # above.
        INTERNAL_API_BASE_URL: http://backend:8000
    image: ${IMAGE_PREFIX:-ghcr.io/ddundee/look}-frontend:latest
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Self-update helper (see updater/updater.py). Pulls and restarts
  # backend, mcp and frontend when you press Update in the web app. Never
  # touches db, the tunnel or itself. No ports: only the backend reaches
  # it, on this compose network, with API_TOKEN. Mounting the Docker
  # socket gives it control of Docker, which is what updating requires.
  updater:
    build: ./updater
    image: ${IMAGE_PREFIX:-ghcr.io/ddundee/look}-updater:latest
    restart: unless-stopped
    working_dir: /project
    environment:
      API_TOKEN: ${API_TOKEN}
      UPDATER_GITHUB_REPO: ${UPDATER_GITHUB_REPO:-Ddundee/look}
      UPDATER_WORKFLOW: ${UPDATER_WORKFLOW:-docker-publish.yml}
      UPDATER_SERVICES: ${UPDATER_SERVICES:-backend mcp frontend}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # OpenAI Secure MCP Tunnel client — outbound-only connection that lets
  # ChatGPT/Codex/the Responses API reach the `mcp` service above without
  # opening any inbound port. Requires OPENAI_TUNNEL_ID + OPENAI_TUNNEL_API_KEY
  # in .env (see docs/DEPLOYMENT.md). Opt-in: only starts with
  # `docker compose --profile openai-tunnel up -d`.
  openai-tunnel:
    image: ghcr.io/openai/tunnel-client:latest
    profiles: ["openai-tunnel"]
    restart: unless-stopped
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}
      CONTROL_PLANE_API_KEY: ${OPENAI_TUNNEL_API_KEY:-}
      MCP_SERVER_URL: http://mcp:8001/mcp
      MCP_EXTRA_HEADERS: "Authorization: Bearer ${API_TOKEN}"
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  postgres_data:
  backend_data:
